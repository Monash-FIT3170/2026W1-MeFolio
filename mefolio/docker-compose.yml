services:
  mongo:
    image: mongo:7
    ports:
      - "3001:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  piper:
    build: ./piper
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/voices', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 60s

  app:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - meteor_local:/app/.meteor/local
      - node_modules:/app/node_modules
    environment:
      ROOT_URL: http://localhost:3000
      PORT: 3000
      MONGO_URL: mongodb://mongo:27017/meteor
      MONGO_OPLOG_URL: ""
      PIPER_URL: http://piper:5000/synthesize
      METEOR_WATCH_FORCE_POLLING: "true"
    depends_on:
      mongo:
        condition: service_healthy
      piper:
        condition: service_healthy
    restart: unless-stopped

volumes:
  meteor_local:
  node_modules:
  mongo_data:
